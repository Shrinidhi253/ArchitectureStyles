image: python:3.12-slim

stages: [test]

# All commands use `python3 -m ...` so the jobs work both inside the Docker image
# and on runners that execute in a shell where only `python3` is installed.
.module:
  stage: test
  before_script:
    - cd $MODULE
    - python3 --version
    - python3 -m pip install -q -r requirements.txt
  script:
    - python3 -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: $MODULE/report.xml

module1-pipeline:
  extends: .module
  variables: { MODULE: module1-pipeline }

module2-microservices:
  extends: .module
  variables: { MODULE: module2-microservices }

module3-pubsub:
  extends: .module
  variables: { MODULE: module3-pubsub }
